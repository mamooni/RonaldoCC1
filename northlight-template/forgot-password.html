<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password — Northlight</title><link rel="stylesheet" href="assets/css/auth.css">
</head><body class="auth"><canvas class="auth__canvas" id="authCanvas" aria-hidden="true"></canvas>
<main class="auth__main"><section class="auth-card">
  <a class="auth-card__logo" href="index.html" aria-label="Northlight home"><img class="auth-card__logo-img" src="logo.png" alt="Northlight"></a>
  <h1 class="auth-title">Reset your password</h1>
  <p class="auth-copy">Enter your account email and we’ll send a reset link.</p>
  <form class="auth-form" id="resetRequestForm" novalidate>
    <div class="field"><label class="sr-only" for="email">Email address</label><input class="field__input" id="email" type="email" autocomplete="email" placeholder="Enter your email address"><p class="field__error" id="emailError" hidden></p></div>
    <button class="auth-submit" type="submit">Send reset link</button>
  </form>
  <p class="auth-status" id="authStatus" role="status" hidden></p>
  <p class="auth-alt"><a href="login.html">Back to sign in</a></p>
</section></main><script src="assets/js/auth.js" defer></script><script src="assets/js/password-reset.js" defer></script></body></html>
