<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a new password — Northlight</title><link rel="stylesheet" href="assets/css/auth.css">
</head><body class="auth"><canvas class="auth__canvas" id="authCanvas" aria-hidden="true"></canvas>
<main class="auth__main"><section class="auth-card">
  <a class="auth-card__logo" href="index.html" aria-label="Northlight home"><img class="auth-card__logo-img" src="logo.png" alt="Northlight"></a>
  <h1 class="auth-title">Choose a new password</h1>
  <form class="auth-form" id="resetConfirmForm" novalidate>
    <div class="field"><label class="sr-only" for="password">New password</label><input class="field__input" id="password" type="password" autocomplete="new-password" placeholder="New password"><p class="field__hint">Use 8+ characters with letters, numbers, and symbols.</p><p class="field__error" id="passwordError" hidden></p></div>
    <button class="auth-submit" type="submit">Update password</button>
  </form>
  <p class="auth-status" id="authStatus" role="status" hidden></p>
</section></main><script src="assets/js/auth.js" defer></script><script src="assets/js/password-reset.js" defer></script></body></html>
