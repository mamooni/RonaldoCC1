<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search Products</title><meta name="description" content="Search the Northlight legitimate product catalogue."><link rel="stylesheet" href="assets/css/styles.css"></head><body><header class="topbar">
  <div class="topbar__inner">
    <a class="topbar__logo" href="index.html" aria-label="Home">
      <img src="logo.png" alt="Northlight" class="topbar__logo-img">
    </a>

    <div class="topbar__center">
      <span class="btn btn--wallet" aria-label="Legitimate product catalogue">
        <span class="btn__label">Product Catalogue</span>
      </span>
    </div>

    <div class="topbar__actions">
      <a class="icon-btn" href="legitimate-cart.html" id="legitCartBtn" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M7 4a3 3 0 0 1 10 0h2.5a1 1 0 0 1 1 .9l1 12A2 2 0 0 1 19.5 19h-15a2 2 0 0 1-2-2.1l1-12a1 1 0 0 1 1-.9H7Zm2 0h6a1 1 0 0 0-2-2h-2a1 1 0 0 0-2 2Z"/>
        </svg>
        <span class="badge" id="legitCartCount" hidden>0</span>
      </a>
    </div>
  </div>
</header>
<nav class="subnav" aria-label="Sections">
  <div class="subnav__inner">
    <a class="tab" href="index.html">Home</a>
    <a class="tab" href="search.html" aria-current="page">Product Catalogue</a>
    <a class="tab" href="support.html">Support</a>
    <a class="tab" href="legitimate-cart.html">Cart</a>
  </div>
</nav><main class="page page--search"><h1 class="search__title">Search Products</h1>
<form class="filters" id="catalogueFilters" novalidate><div class="filters__grid">
<div class="filters__col">
<div class="field-sm"><label class="field-sm__label" for="productQuery">Product or Seller</label><input class="input-sm" id="productQuery" type="search" placeholder="Search products" autocomplete="off"></div>
<div class="field-sm"><label class="field-sm__label" for="productMarket">Market</label><select class="select select--block" id="productMarket"><option value="">All countries</option></select></div>
<div class="field-sm"><label class="field-sm__label" for="productFormat">Format</label><select class="select select--block" id="productFormat"><option value="">All formats</option><option value="digital">Digital</option><option value="physical">Physical</option><option value="service">Service</option></select></div></div>
<div class="filters__col">
<div class="field-sm"><label class="field-sm__label" for="productSort">Sort by</label><select class="select select--block" id="productSort"><option value="newest">Newest</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="name">Name: A to Z</option></select></div>
<div class="field-sm"><label class="field-sm__label" for="minPrice">Minimum price (USD)</label><input class="input-sm" id="minPrice" type="number" min="0" step="0.01" placeholder="0"></div>
<div class="field-sm"><label class="field-sm__label" for="maxPrice">Maximum price (USD)</label><input class="input-sm" id="maxPrice" type="number" min="0" step="0.01" placeholder="No limit"></div>
<div class="field-sm"><label class="field-sm__label" for="productPageSize">Show entries</label><select class="select select--block" id="productPageSize"><option>10</option><option selected>25</option><option>50</option></select></div>
</div></div><div class="filters__actions"><button class="btn btn--primary filters__submit" type="submit">Search</button><button class="btn" type="reset" id="resetFilters">Clear</button></div></form>
<section class="results"><div class="results__bar"><span id="resultCount">Loading products…</span><span id="catalogueStatus" role="status"></span></div>
<div class="results__scroll"><table class="rtable" aria-label="Legitimate products"><thead><tr><th>Product</th><th>Seller</th><th>Quality</th><th>ID</th><th>ExpDate</th><th>Address</th><th>Refund period</th><th>Price</th><th>Action</th></tr></thead><tbody id="productRows"><tr><td colspan="9">Loading products…</td></tr></tbody></table></div>
<nav class="pager" id="productPager" aria-label="Product pages"></nav></section></main><script src="assets/js/menu.js" defer></script><script src="assets/js/legitimate-cart.js" defer></script><script src="assets/js/legitimate-search.js" defer></script></body></html>
