<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Products</title>
  <meta name="description" content="Browse and search legitimate products in the Northlight catalogue.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .catalogue{width:min(1200px,calc(100% - 32px));margin:36px auto 64px}
    .catalogue__intro{margin-bottom:22px}
    .catalogue__intro h1{margin:0 0 8px;font-size:clamp(1.6rem,3vw,2.2rem)}
    .catalogue__intro p{margin:0;color:var(--muted,#8b929d)}
    .catalogue__filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end;padding:18px;border:1px solid var(--line,#2a303a);border-radius:14px;background:var(--surface,#151a22);margin-bottom:20px}
    .catalogue__field{display:grid;gap:7px;min-width:0}
    .catalogue__field label{font-size:.82rem;color:var(--muted,#a1a8b3)}
    .catalogue__field input,.catalogue__field select{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--line,#343b47);border-radius:8px;background:var(--bg,#10141b);color:inherit}
    .catalogue__meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0;color:var(--muted,#a1a8b3);font-size:.9rem}
    .catalogue__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .product-card{min-width:0;overflow:hidden;border:1px solid var(--line,#2a303a);border-radius:14px;background:var(--surface,#151a22)}
    .product-card__image{height:170px;background:var(--bg,#10141b);display:grid;place-items:center;color:var(--muted,#a1a8b3);overflow:hidden}
    .product-card__image img{width:100%;height:100%;object-fit:cover}
    .product-card__body{padding:15px}
    .product-card__eyebrow{font-size:.76rem;color:var(--muted,#a1a8b3);margin-bottom:7px}
    .product-card h2{font-size:1.05rem;margin:0 0 8px}
    .product-card p{font-size:.9rem;color:var(--muted,#a1a8b3);margin:0 0 14px;line-height:1.5}
    .product-card__foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .product-card__price{font-weight:700}
    .catalogue__empty{padding:38px 18px;text-align:center;border:1px dashed var(--line,#343b47);border-radius:12px;color:var(--muted,#a1a8b3);grid-column:1/-1}
    .catalogue__pager{display:flex;justify-content:center;gap:8px;margin-top:22px}
    .catalogue__pager button{padding:8px 13px;border:1px solid var(--line,#343b47);border-radius:8px;background:var(--surface,#151a22);color:inherit;cursor:pointer}
    .catalogue__pager button[aria-current="page"]{border-color:var(--accent,#7c8cff)}
    @media(max-width:850px){.catalogue__filters{grid-template-columns:repeat(2,minmax(0,1fr))}.catalogue__filters .catalogue__field:first-child{grid-column:1/-1}.catalogue__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){.catalogue__filters{grid-template-columns:1fr}.catalogue__filters .catalogue__field:first-child{grid-column:auto}.catalogue__grid{grid-template-columns:1fr}.catalogue__meta{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__logo" href="index.html" aria-label="Home"><img src="logo.png" alt="Northlight" class="topbar__logo-img"></a>
      <div class="topbar__actions">
        <a class="btn btn--primary" href="index.html">Home</a>
      </div>
    </div>
  </header>

  <main class="catalogue">
    <header class="catalogue__intro">
      <h1>Browse products</h1>
      <p>Search the catalogue for legitimate digital and physical products.</p>
    </header>

    <form class="catalogue__filters" id="catalogueFilters">
      <div class="catalogue__field">
        <label for="productQuery">Search products</label>
        <input id="productQuery" type="search" placeholder="Search by product name or description" autocomplete="off">
      </div>
      <div class="catalogue__field">
        <label for="productCategory">Category</label>
        <select id="productCategory"><option value="">All categories</option></select>
      </div>
      <div class="catalogue__field">
        <label for="productFormat">Format</label>
        <select id="productFormat">
          <option value="">All formats</option>
          <option value="physical">Physical</option>
          <option value="digital">Digital</option>
          <option value="service">Service</option>
        </select>
      </div>
      <div class="catalogue__field">
        <label for="productSort">Sort by</label>
        <select id="productSort">
          <option value="newest">Newest</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
          <option value="name">Name: A to Z</option>
        </select>
      </div>
      <button class="btn btn--primary" type="submit">Search</button>
      <div class="catalogue__field">
        <label for="minPrice">Minimum price</label>
        <input id="minPrice" type="number" min="0" step="0.01" placeholder="0">
      </div>
      <div class="catalogue__field">
        <label for="maxPrice">Maximum price</label>
        <input id="maxPrice" type="number" min="0" step="0.01" placeholder="No limit">
      </div>
      <div class="catalogue__field">
        <label for="productPageSize">Products per page</label>
        <select id="productPageSize"><option>9</option><option>18</option><option>36</option></select>
      </div>
      <button class="btn" type="reset" id="resetFilters">Clear filters</button>
    </form>

    <div class="catalogue__meta">
      <span id="resultCount" aria-live="polite">Loading products…</span>
      <span id="catalogueStatus" role="status"></span>
    </div>
    <section class="catalogue__grid" id="productGrid" aria-label="Products">
      <div class="catalogue__empty">Loading the product catalogue…</div>
    </section>
    <nav class="catalogue__pager" id="productPager" aria-label="Product pages"></nav>
  </main>

  <script>
  (() => {
    "use strict";
    const API = "/api/legitimate-products";
    const els = {
      form: document.getElementById("catalogueFilters"),
      query: document.getElementById("productQuery"),
      category: document.getElementById("productCategory"),
      format: document.getElementById("productFormat"),
      sort: document.getElementById("productSort"),
      min: document.getElementById("minPrice"),
      max: document.getElementById("maxPrice"),
      size: document.getElementById("productPageSize"),
      grid: document.getElementById("productGrid"),
      count: document.getElementById("resultCount"),
      status: document.getElementById("catalogueStatus"),
      pager: document.getElementById("productPager")
    };
    let products = [];
    let page = 1;

    const clean = value => String(value ?? "").trim();
    const money = value => {
      const amount = Number(value);
      return Number.isFinite(amount) ? "$" + amount.toFixed(2) : "Price on request";
    };
    const escapeHtml = value => clean(value).replace(/[&<>"']/g, char => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[char]);

    function filteredProducts() {
      const q = clean(els.query.value).toLowerCase();
      const category = els.category.value;
      const format = els.format.value;
      const min = els.min.value === "" ? 0 : Number(els.min.value);
      const max = els.max.value === "" ? Infinity : Number(els.max.value);
      const list = products.filter(item => {
        const searchable = [item.name, item.description, item.seller, item.category].map(clean).join(" ").toLowerCase();
        const price = Number(item.price);
        return (!q || searchable.includes(q))
          && (!category || clean(item.category) === category)
          && (!format || clean(item.format).toLowerCase() === format)
          && Number.isFinite(price) && price >= min && price <= max;
      });
      const sort = els.sort.value;
      list.sort((a,b) => {
        if (sort === "price-low") return Number(a.price) - Number(b.price);
        if (sort === "price-high") return Number(b.price) - Number(a.price);
        if (sort === "name") return clean(a.name).localeCompare(clean(b.name));
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });
      return list;
    }

    function render() {
      const list = filteredProducts();
      const pageSize = Number(els.size.value) || 9;
      const pages = Math.max(1, Math.ceil(list.length / pageSize));
      page = Math.min(page, pages);
      const start = (page - 1) * pageSize;
      const shown = list.slice(start, start + pageSize);
      els.count.textContent = list.length + (list.length === 1 ? " product" : " products");
      els.grid.innerHTML = "";
      if (!shown.length) {
        const empty = document.createElement("div");
        empty.className = "catalogue__empty";
        empty.textContent = products.length ? "No products match those filters." : "No products have been published yet.";
        els.grid.appendChild(empty);
      } else {
        shown.forEach(item => {
          const card = document.createElement("article");
          card.className = "product-card";
          const image = clean(item.image_url);
          card.innerHTML = `
            <div class="product-card__image">${image ? '<img src="' + escapeHtml(image) + '" alt="' + escapeHtml(item.name) + '" loading="lazy">' : 'Product image'}</div>
            <div class="product-card__body">
              <div class="product-card__eyebrow">${escapeHtml(item.category)} · ${escapeHtml(item.format)}</div>
              <h2>${escapeHtml(item.name)}</h2>
              <p>${escapeHtml(item.description || "No description provided.")}</p>
              <div class="product-card__foot"><span class="product-card__price">${money(item.price)}</span><span>${escapeHtml(item.seller || "")}</span></div>
            </div>`;
          els.grid.appendChild(card);
        });
      }
      els.pager.innerHTML = "";
      if (pages > 1) {
        for (let n = 1; n <= pages; n++) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = String(n);
          if (n === page) button.setAttribute("aria-current", "page");
          button.addEventListener("click", () => { page = n; render(); });
          els.pager.appendChild(button);
        }
      }
    }

    function updateCategories() {
      const current = els.category.value;
      const categories = [...new Set(products.map(item => clean(item.category)).filter(Boolean))].sort();
      els.category.innerHTML = '<option value="">All categories</option>' + categories.map(value =>
        '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>'
      ).join("");
      if (categories.includes(current)) els.category.value = current;
    }

    async function loadProducts() {
      try {
        const response = await fetch(API, { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error("Catalogue API returned " + response.status);
        const payload = await response.json();
        products = Array.isArray(payload) ? payload : Array.isArray(payload.products) ? payload.products : [];
        products = products.filter(item => item && item.status !== "draft");
        updateCategories();
        els.status.textContent = "";
        render();
      } catch (error) {
        products = [];
        els.status.textContent = "The product feed is not connected yet.";
        render();
      }
    }

    els.form.addEventListener("submit", event => { event.preventDefault(); page = 1; render(); });
    els.form.addEventListener("reset", () => setTimeout(() => { page = 1; render(); }, 0));
    [els.query, els.category, els.format, els.sort, els.min, els.max, els.size].forEach(control => {
      control.addEventListener("input", () => { page = 1; render(); });
      control.addEventListener("change", () => { page = 1; render(); });
    });
    loadProducts();
  })();
  </script>
</body>
</html>
