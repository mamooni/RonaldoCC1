<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium Cart — Northlight</title>
  <meta
    name="description"
    content="Review your premium digital product selections."
  />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body data-requires-auth>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__logo" href="index.html" aria-label="Home">
        <img src="logo.png" alt="Northlight" class="topbar__logo-img" />
      </a>

      <div class="topbar__center">
        <a href="expensive.html" class="topbar__brand">Premium Products</a>
      </div>

      <div class="topbar__right">
        <a class="tab" href="expensive.html">Continue Shopping</a>
      </div>
    </div>
  </header>

  <main class="page page--cart">
    <section class="cart" aria-labelledby="expensiveCartTitle">
      <header class="cart__head">
        <h1 class="cart__title" id="expensiveCartTitle">
          Premium Products Cart
        </h1>
      </header>

      <div class="cart__body">
        <p class="cart__empty" id="expensiveCartEmpty">
          Your cart is empty.
        </p>

        <ul
          class="cart__list"
          id="expensiveCartList"
          aria-label="Premium products in your cart"
          hidden
        ></ul>

        <div class="summary">
          <h2 class="summary__title">Order Summary</h2>

          <p class="summary__row">
            <span class="summary__label">Items:</span>
            <span id="expensiveCartCount">0</span>
          </p>

          <p class="summary__row">
            <span class="summary__label">Total:</span>
            <span class="summary__total" id="expensiveCartTotal">
              Price will be confirmed at checkout
            </span>
          </p>

          <button
            class="summary__btn"
            type="button"
            id="expensiveCartCheckout"
            disabled
          >
            Continue to Checkout
          </button>

          <p
            class="summary__note"
            id="expensiveCartNote"
            role="status"
            hidden
          ></p>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/menu.js" defer></script>
  <script src="assets/js/session.js" defer></script>
  <script src="assets/js/expensive-cart.js" defer></script>
  <script src="assets/js/expensive-cart-page.js" defer></script>

</body>
</html>
